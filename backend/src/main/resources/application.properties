
# AI Code Review System - Application Config


# Server
server.port=8080

# ---- DATABASE (Switch to PostgreSQL in production) ----
# Development: H2 in-memory
spring.datasource.url=jdbc:h2:mem:codereviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Production PostgreSQL (uncomment and fill when deploying):
# spring.datasource.url=jdbc:postgresql://your-host:5432/codereviewdb
# spring.datasource.username=your_user
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Production: org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
jwt.secret=aicodereview_super_secret_key_change_this_in_production_256bits
jwt.expiration=86400000

# ---- GROQ API ----
# Get your free key at: https://console.groq.com
groq.api.key=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
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
# ---- CORS ----
cors.allowed.origins=http://localhost:3000,https://your-frontend.vercel.app

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Logging ----
logging.level.com.codereview=INFO
logging.level.org.springframework.security=WARN
